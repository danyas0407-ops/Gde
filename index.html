<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чепуха 3D - Игра с друзьями</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js для 3D графики -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Шрифты Google -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }
        /* Стеклянный эффект для карточек */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        canvas {
            display: block;
            outline: none;
        }
        .hidden-screen {
            display: none !important;
        }
    </style>
</head>
<body class="flex flex-col lg:flex-row h-screen">

    <!-- Левая часть: 3D Персонаж -->
    <div class="w-full lg:w-1/2 h-64 lg:h-full relative flex flex-col justify-center items-center p-4">
        <h1 class="text-3xl font-black mb-2 z-10 absolute top-6 drop-shadow-lg text-center w-full">ЧЕПУХА 3D</h1>
        
        <!-- Контейнер для 3D Canvas -->
        <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

        <!-- Баланс монет -->
        <div class="glass-panel absolute top-6 right-6 px-4 py-2 flex items-center gap-2 z-10 font-bold text-yellow-300">
            <span>🪙</span>
            <span id="coin-balance">0</span>
        </div>
    </div>

    <!-- Правая часть: Интерфейс игры и магазина -->
    <div class="w-full lg:w-1/2 h-full p-4 lg:p-8 flex flex-col z-10 overflow-y-auto">
        
        <!-- НАВИГАЦИЯ -->
        <div class="flex justify-center gap-4 mb-8">
            <button onclick="switchTab('game')" id="btn-game" class="glass-panel px-6 py-2 font-bold hover:bg-white/30 transition border-b-4 border-white">Играть</button>
            <button onclick="switchTab('shop')" id="btn-shop" class="glass-panel px-6 py-2 font-bold hover:bg-white/30 transition opacity-70">Магазин</button>
        </div>

        <!-- ЭКРАН 1: ИГРА -->
        <div id="tab-game" class="flex-1 flex flex-col">
            
            <!-- Состояние 1: Вопрос -->
            <div id="screen-question" class="glass-panel p-8 flex-1 flex flex-col justify-center items-center text-center">
                <p class="text-sm uppercase tracking-widest mb-2 opacity-80" id="question-counter">Вопрос 1 из 7</p>
                <h2 class="text-3xl lg:text-4xl font-bold mb-8" id="question-text">Кто это был?</h2>
                
                <input type="text" id="answer-input" placeholder="Напишите ответ тут..." 
                    class="w-full max-w-md bg-white/20 border-2 border-white/50 rounded-xl px-4 py-3 text-white placeholder-white/60 focus:outline-none focus:border-white focus:bg-white/30 transition text-lg mb-6 autocomplete-off">
                
                <button onclick="submitAnswer()" class="bg-gradient-to-r from-pink-500 to-orange-400 hover:from-pink-600 hover:to-orange-500 text-white font-bold py-3 px-10 rounded-full shadow-lg transform hover:scale-105 transition">
                    Ответить и передать ход
                </button>
            </div>

            <!-- Состояние 2: Передача устройства (чтобы не подглядывать) -->
            <div id="screen-pass" class="glass-panel p-8 flex-1 flex flex-col justify-center items-center text-center hidden-screen">
                <span class="text-6xl mb-4">🙈</span>
                <h2 class="text-3xl font-bold mb-4">Ответ скрыт!</h2>
                <p class="mb-8 text-lg opacity-90">Передай устройство следующему игроку (подруге), чтобы она не видела твой ответ.</p>
                <button onclick="nextQuestion()" class="bg-white/20 hover:bg-white/30 border-2 border-white text-white font-bold py-3 px-10 rounded-full transition">
                    Я готов(а), показать вопрос
                </button>
            </div>

            <!-- Состояние 3: Результат истории -->
            <div id="screen-result" class="glass-panel p-8 flex-1 flex flex-col justify-center items-center text-center hidden-screen">
                <h2 class="text-3xl font-bold mb-2 text-yellow-300">История готова!</h2>
                <p class="mb-6 opacity-80 text-sm">Вы заработали +50 🪙</p>
                
                <div class="bg-black/30 p-6 rounded-xl w-full max-w-lg mb-8 text-left text-lg leading-relaxed shadow-inner" id="story-result">
                    <!-- Сюда вставится история -->
                </div>
                
                <button onclick="restartGame()" class="bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold py-3 px-10 rounded-full shadow-lg transform hover:scale-105 transition">
                    Сыграть еще раз
                </button>
            </div>
        </div>

        <!-- ЭКРАН 2: МАГАЗИН -->
        <div id="tab-shop" class="flex-1 flex flex-col hidden-screen">
            <div class="glass-panel p-6 flex-1">
                <h2 class="text-2xl font-bold mb-6 text-center">Магазин скинов персонажа</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="shop-items">
                    <!-- Товары генерируются через JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- Логика Игры -->
    <script>
        // ==========================================
        // НАСТРОЙКИ ИГРЫ И СОСТОЯНИЕ
        // ==========================================
        const questions = [
            "Кто это был?",
            "С кем он был?",
            "Где это происходило?",
            "Что они делали?",
            "Кто неожиданно пришел?",
            "Что он сказал?",
            "Чем все закончилось?"
        ];

        const skins = {
            classic: { id: 'classic', name: 'Студент', price: 0, color: 0x3b82f6 },
            gold: { id: 'gold', name: 'Золотой VIP', price: 100, color: 0xffd700 },
            ninja: { id: 'ninja', name: 'Ниндзя', price: 200, color: 0x1f2937 },
            neon: { id: 'neon', name: 'Киберпанк', price: 300, color: 0x10b981 },
            pink: { id: 'pink', name: 'Барби-стиль', price: 400, color: 0xff69b4 }
        };

        // Загрузка данных из LocalStorage (чтобы сохранялось при обновлении)
        let coins = parseInt(localStorage.getItem('chepuha_coins')) || 0;
        let ownedSkins = JSON.parse(localStorage.getItem('chepuha_skins')) || ['classic'];
        let currentSkinId = localStorage.getItem('chepuha_current_skin') || 'classic';
        
        let currentQIndex = 0;
        let currentAnswers = [];

        // Инициализация интерфейса
        document.getElementById('coin-balance').innerText = coins;
        updateShopUI();

        // ==========================================
        // ЛОГИКА ИНТЕРФЕЙСА (ЧЕПУХА)
        // ==========================================
        function switchTab(tab) {
            if(tab === 'game') {
                document.getElementById('tab-game').classList.remove('hidden-screen');
                document.getElementById('tab-shop').classList.add('hidden-screen');
                document.getElementById('btn-game').classList.remove('opacity-70');
                document.getElementById('btn-game').classList.add('border-b-4', 'border-white');
                document.getElementById('btn-shop').classList.add('opacity-70');
                document.getElementById('btn-shop').classList.remove('border-b-4', 'border-white');
            } else {
                document.getElementById('tab-game').classList.add('hidden-screen');
                document.getElementById('tab-shop').classList.remove('hidden-screen');
                document.getElementById('btn-shop').classList.remove('opacity-70');
                document.getElementById('btn-shop').classList.add('border-b-4', 'border-white');
                document.getElementById('btn-game').classList.add('opacity-70');
                document.getElementById('btn-game').classList.remove('border-b-4', 'border-white');
            }
        }

        function submitAnswer() {
            const input = document.getElementById('answer-input');
            const val = input.value.trim();
            if(!val) {
                alert("Напиши хоть что-нибудь!");
                return;
            }

            currentAnswers.push(val);
            input.value = '';

            if (currentAnswers.length >= questions.length) {
                showResult();
            } else {
                // Показываем экран-заглушку для передачи устройства
                document.getElementById('screen-question').classList.add('hidden-screen');
                document.getElementById('screen-pass').classList.remove('hidden-screen');
            }
        }

        function nextQuestion() {
            currentQIndex++;
            document.getElementById('question-counter').innerText = `Вопрос ${currentQIndex + 1} из ${questions.length}`;
            document.getElementById('question-text').innerText = questions[currentQIndex];
            
            document.getElementById('screen-pass').classList.add('hidden-screen');
            document.getElementById('screen-question').classList.remove('hidden-screen');
            document.getElementById('answer-input').focus();
        }

        function showResult() {
            document.getElementById('screen-question').classList.add('hidden-screen');
            document.getElementById('screen-result').classList.remove('hidden-screen');

            // Составляем смешную историю
            const story = `
                Однажды <b>${currentAnswers[0]}</b> 
                вместе с <b>${currentAnswers[1]}</b> 
                отправились в <b>${currentAnswers[2]}</b>. 
                Там они <b>${currentAnswers[3]}</b>. 
                Вдруг туда пришел <b>${currentAnswers[4]}</b> 
                и сказал: "<i>${currentAnswers[5]}</i>". 
                В итоге всё закончилось тем, что <b>${currentAnswers[6]}</b>!
            `;
            document.getElementById('story-result').innerHTML = story;

            // Начисляем монеты
            coins += 50;
            saveData();
            document.getElementById('coin-balance').innerText = coins;
            updateShopUI();
            
            // Радуемся в 3D (заставляем персонажа прыгать)
            characterJump();
        }

        function restartGame() {
            currentQIndex = 0;
            currentAnswers = [];
            document.getElementById('question-counter').innerText = `Вопрос 1 из ${questions.length}`;
            document.getElementById('question-text').innerText = questions[0];
            
            document.getElementById('screen-result').classList.add('hidden-screen');
            document.getElementById('screen-question').classList.remove('hidden-screen');
        }

        // Позволяем отправлять ответ по нажатию Enter
        document.getElementById('answer-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitAnswer();
        });


        // ==========================================
        // ЛОГИКА МАГАЗИНА
        // ==========================================
        function updateShopUI() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';

            for (const key in skins) {
                const skin = skins[key];
                const isOwned = ownedSkins.includes(skin.id);
                const isEquipped = currentSkinId === skin.id;

                let btnHtml = '';
                if (isEquipped) {
                    btnHtml = `<button disabled class="w-full bg-green-500 text-white py-2 rounded font-bold opacity-70 cursor-not-allowed">Надето</button>`;
                } else if (isOwned) {
                    btnHtml = `<button onclick="equipSkin('${skin.id}')" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded font-bold transition">Надеть</button>`;
                } else {
                    const canAfford = coins >= skin.price;
                    btnHtml = `<button onclick="buySkin('${skin.id}')" class="w-full ${canAfford ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-gray-500 opacity-50 cursor-not-allowed'} text-white py-2 rounded font-bold transition">
                        Купить за ${skin.price} 🪙
                    </button>`;
                }

                container.innerHTML += `
                    <div class="bg-white/10 border border-white/20 p-4 rounded-xl text-center">
                        <div class="w-16 h-16 rounded-full mx-auto mb-3 border-4 border-white/30" style="background-color: #${skin.color.toString(16).padStart(6, '0')}"></div>
                        <h3 class="font-bold text-lg mb-3">${skin.name}</h3>
                        ${btnHtml}
                    </div>
                `;
            }
        }

        function buySkin(id) {
            const skin = skins[id];
            if (coins >= skin.price) {
                coins -= skin.price;
                ownedSkins.push(id);
                equipSkin(id); // Сразу надеваем при покупке
                saveData();
                document.getElementById('coin-balance').innerText = coins;
            } else {
                alert("Не хватает монет! Сыграйте еще пару раз.");
            }
        }

        function equipSkin(id) {
            currentSkinId = id;
            saveData();
            updateShopUI();
            update3DSkin(); // Обновляем цвет персонажа в 3D
        }

        function saveData() {
            localStorage.setItem('chepuha_coins', coins);
            localStorage.setItem('chepuha_skins', JSON.stringify(ownedSkins));
            localStorage.setItem('chepuha_current_skin', currentSkinId);
        }

        // ==========================================
        // 3D ГРАФИКА (Three.js) - Персонаж
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Камера
